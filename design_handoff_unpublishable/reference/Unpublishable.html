<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Space Grotesk", system-ui, sans-serif;
    background: #1a1a1a;
    color: #eee;
    min-height: 100vh;
  }
  a { color: inherit; }
  button { font: inherit; }

  /* App-level layout (between Tweaks toggling) */
  #root {
    min-height: 100vh;
  }

  /* The directional viewport — each direction styles itself inside this */
  .unpub-viewport {
    min-height: 100vh;
    width: 100%;
  }

  /* When user is reading, allow scroll inside the page */
  ::selection { background: #ffe85c; color: #000; }
</style>
